name: Build Route Distances

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-distances:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Calculate route distances
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          PRIVATE_LOCATIONS_JSON: ${{ secrets.PRIVATE_LOCATIONS_JSON }}
        run: |
          python scripts/build_route_distances.py

      - name: Commit updated route distances
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/route_distances.json

          if git diff --cached --quiet; then
            echo "No distance changes to commit."
          else
            git commit -m "Update route distances"
            git push
          fi
